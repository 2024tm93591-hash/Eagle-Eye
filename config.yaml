# =====================================================================
#  ThreatVision - AI-Based Scene Understanding & Threat Detection
#  Central configuration file. Every module reads its settings from here.
# =====================================================================

source:
  # 0 / 1 = webcam index, a file path (data/videos/x.mp4), an RTSP/HTTP URL,
  # or "simulated" for the built-in synthetic scene (no camera / models needed).
  uri: "simulated"
  loop_video: true          # restart file sources when they end
  resize_width: 960         # frames are resized to this width before processing (0 = keep)
  camera_name: "CAM-01 Main Entrance"

detection:
  # yolo  : Ultralytics YOLOv8-pose (person boxes + 17 COCO keypoints) + ByteTrack
  # hog   : OpenCV HOG+SVM people detector + IoU tracker (baseline, no keypoints)
  # simulated : ground truth from the synthetic scene (for self-testing)
  backend: "yolo"
  yolo_model: "models/yolov8n-pose.pt"
  object_model: "models/yolov8n.pt"   # used for bag / abandoned-object detection
  object_every_n_frames: 5
  conf_threshold: 0.40
  iou_threshold: 0.50
  tracker: "bytetrack.yaml"
  device: ""                # "" = auto, "cpu", "0" (first CUDA GPU)
  imgsz: 640

gender:
  # face_dnn : OpenCV DNN face detector + Levi-Hassner gender CaffeNet (face must be visible)
  # body_cnn : MobileNetV3 trained on full-body crops (scripts/train_gender.py) - works on CCTV
  # hybrid   : face_dnn when a face is found, otherwise body_cnn
  # none     : disable gender estimation
  backend: "hybrid"
  face_proto: "models/face_deploy.prototxt"
  face_model: "models/res10_300x300_ssd_iter_140000.caffemodel"
  gender_proto: "models/gender_deploy.prototxt"
  gender_model: "models/gender_net.caffemodel"
  body_model: "models/gender_body_mobilenetv3.pt"
  every_n_frames: 3         # classify each track every N frames, votes are accumulated
  min_votes: 3              # votes required before a label is shown
  min_confidence: 0.60      # accumulated confidence required (else "unknown")

activity:
  # rule_based : interpretable heuristics on motion + pose geometry (no training needed)
  # lstm       : 2-layer bi-LSTM over pose sequences   (scripts/train_activity.py)
  # tcn        : temporal convolutional network over pose sequences
  backend: "rule_based"
  classes: ["standing", "walking", "running", "fighting", "falling"]
  window: 30                # frames per sequence given to the learned models
  lstm_model: "models/activity_lstm.pt"
  tcn_model: "models/activity_tcn.pt"
  smoothing: 7              # majority vote over the last N predictions per track
  rules:                    # thresholds are in body-heights per second (scale invariant)
    walk_speed: 0.25
    run_speed: 1.10
    fall_torso_angle: 55    # degrees from vertical
    fall_drop_speed: 0.90   # downward hip speed that marks a fall in progress
    fall_aspect_ratio: 1.15 # bbox width/height above this = lying
    fight_limb_speed: 2.60  # wrist speed relative to body centre
    fight_distance: 1.10    # max centre distance (in body heights) to the opponent

scene:
  zones:                    # polygons in normalised [0..1] image coordinates
    - name: "Restricted Area"
      type: "restricted"
      sensitivity: 1.0
      polygon: [[0.72, 0.36], [0.98, 0.36], [0.98, 0.58], [0.72, 0.58]]
  loiter_seconds: 25
  loiter_radius: 3.0        # max spread (body heights) of positions while loitering
  crowd_threshold: 8        # people in scene
  cluster_distance: 1.2     # body heights, used to find groups
  group_size: 4             # people in one tight cluster = gathering
  group_running: 3          # people running at the same time = panic / stampede
  person_down_seconds: 6    # still lying after a fall for this long = critical
  abandoned_seconds: 15
  abandoned_radius: 2.0     # body heights: no owner within this radius
  chase_min_seconds: 1.5
  min_fight_seconds: 0.6    # violent motion must persist this long before an altercation is reported
  quiet_hours: ["22:00", "06:00"]   # presence at these times raises severity

threat:
  base_scores:              # 0..100
    fighting: 75
    physical_altercation: 80
    fall: 55
    person_down: 85
    restricted_zone_intrusion: 60
    loitering: 35
    crowd_gathering: 30
    group_gathering: 35
    panic_running: 70
    running: 20
    chasing: 65
    abandoned_object: 65
    after_hours_presence: 40
  levels:                   # score thresholds (lower bound)
    LOW: 0
    MEDIUM: 35
    HIGH: 60
    CRITICAL: 80
  min_alert_level: "MEDIUM" # LOW-scored events are shown on the video overlay but not raised as alerts
  cooldown_seconds: 20      # same event on same people is not re-alerted within this window
  escalation_step: 10       # ...unless its score rose by at least this much

alerts:
  snapshot_dir: "data/snapshots"
  db_path: "data/events.db"
  min_level_console: "MEDIUM"
  email:
    enabled: false
    min_level: "HIGH"
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    username: ""
    password_env: "THREATVISION_SMTP_PASSWORD"   # password is read from this env variable
    to: []
  webhook:                  # generic JSON POST (Slack / Teams / custom SOC endpoint)
    enabled: false
    min_level: "HIGH"
    url: ""
  telegram:
    enabled: false
    min_level: "HIGH"
    bot_token_env: "THREATVISION_TELEGRAM_TOKEN"
    chat_id: ""

dashboard:
  host: "0.0.0.0"
  port: 5000
  jpeg_quality: 80
  metrics_file: "results/metrics.json"
