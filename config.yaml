# ThreatVision settings. Every module reads its configuration from this file.

source:
  # a webcam number (0, 1, ...), a video file such as data/videos/clip.mp4, or an RTSP/HTTP camera URL
  uri: "0"
  loop_video: true          # start video files again when they end
  resize_width: 960         # frames are scaled to this width before processing (0 = keep the size)
  camera_name: "CAM-01 Main Entrance"

detection:
  # yolo: YOLOv8-pose (person boxes + 17 keypoints) with ByteTrack
  # hog:  OpenCV HOG + SVM people detector with an IoU tracker (older baseline, no keypoints)
  backend: "yolo"
  yolo_model: "models/yolov8n-pose.pt"
  object_model: "models/yolov8n.pt"   # finds bags for the abandoned-object check
  object_every_n_frames: 5
  conf_threshold: 0.40
  iou_threshold: 0.50
  tracker: "bytetrack.yaml"
  device: ""                # "" picks automatically, or "cpu", or "0" for the first CUDA GPU
  imgsz: 640

gender:
  # face_dnn: OpenCV face detector + Levi-Hassner gender CaffeNet (needs a visible face)
  # body_cnn: MobileNetV3 trained on full-body crops (scripts/train_gender.py), better for CCTV
  # hybrid:   face_dnn when a face is found, otherwise body_cnn
  # none:     no gender estimation
  backend: "hybrid"
  face_proto: "models/face_deploy.prototxt"
  face_model: "models/res10_300x300_ssd_iter_140000.caffemodel"
  gender_proto: "models/gender_deploy.prototxt"
  gender_model: "models/gender_net.caffemodel"
  body_model: "models/gender_body_mobilenetv3.pt"
  every_n_frames: 3         # classify each person every N frames and add up the votes
  min_votes: 3              # votes needed before a label is shown
  min_confidence: 0.60      # below this the person stays "unknown"

activity:
  # rule_based: hand-written rules on motion and pose (no training needed)
  # lstm:       2-layer bidirectional LSTM over pose sequences (scripts/train_activity.py)
  # tcn:        temporal convolutional network over pose sequences
  backend: "rule_based"
  classes: ["standing", "walking", "running", "fighting", "falling"]
  window: 30                # frames per sequence for the learned models
  lstm_model: "models/activity_lstm.pt"
  tcn_model: "models/activity_tcn.pt"
  smoothing: 7              # majority vote over the last N predictions for each person
  rules:                    # speeds are in body heights per second, so camera distance doesn't matter
    walk_speed: 0.25
    run_speed: 1.10
    fall_torso_angle: 55    # degrees away from upright
    fall_drop_speed: 0.90   # how fast the hips must drop to count as a fall
    fall_aspect_ratio: 1.15 # a box wider than this (width / height) means lying down
    fight_limb_speed: 2.60  # wrist speed relative to the body centre
    fight_distance: 1.10    # how close (in body heights) the other person must be

scene:
  loiter_seconds: 25
  loiter_radius: 3.0        # body heights; staying within this area counts as loitering
  crowd_threshold: 8        # people in view
  cluster_distance: 1.2     # body heights between people in the same group
  group_size: 4             # this many people close together is a gathering
  group_running: 3          # this many people running at once suggests panic
  person_down_seconds: 6    # still on the ground this long after a fall = critical
  abandoned_seconds: 15
  abandoned_radius: 2.0     # body heights; nobody this close means the bag is unattended
  chase_min_seconds: 1.5
  min_fight_seconds: 0.6    # violent motion has to last this long before it's reported
  quiet_hours: ["22:00", "06:00"]   # anyone present at these times raises the score

threat:
  base_scores:              # 0 to 100
    fighting: 75
    physical_altercation: 80
    fall: 55
    person_down: 85
    loitering: 35
    crowd_gathering: 30
    group_gathering: 35
    panic_running: 70
    running: 20
    chasing: 65
    abandoned_object: 65
    after_hours_presence: 40
  levels:                   # lowest score for each level
    LOW: 0
    MEDIUM: 35
    HIGH: 60
    CRITICAL: 80
  min_alert_level: "MEDIUM" # LOW events only appear on the video, they aren't raised as alerts
  cooldown_seconds: 20      # the same event for the same people isn't raised again within this time
  escalation_step: 10       # ...unless its score went up by at least this much

alerts:
  snapshot_dir: "data/snapshots"
  db_path: "data/events.db"
  min_level_console: "MEDIUM"
  email:
    enabled: false
    min_level: "HIGH"
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    username: ""
    password_env: "THREATVISION_SMTP_PASSWORD"   # the password is read from this environment variable
    to: []
  webhook:                  # a JSON POST, e.g. to Slack, Teams or your own endpoint
    enabled: false
    min_level: "HIGH"
    url: ""
  telegram:
    enabled: false
    min_level: "HIGH"
    bot_token_env: "THREATVISION_TELEGRAM_TOKEN"
    chat_id: ""

dashboard:
  host: "0.0.0.0"
  port: 5000
  jpeg_quality: 80
  metrics_file: "results/metrics.json"
