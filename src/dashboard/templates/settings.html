{% extends "base.html" %}
{% block title %}Sources & settings{% endblock %}
{% block content %}
<div class="topbar">
  <div>
    <h1>Sources &amp; settings</h1>
    <div class="sub">Current source: <b id="cur">{{ current }}</b></div>
  </div>
</div>

<div class="grid two">
  <div class="panel">
    <h2>Video source</h2>
    <div class="grid" style="gap:10px">
      <div>
        <button class="btn" onclick="setSource('0')">Webcam 0</button>
        <button class="btn" onclick="setSource('1')">Webcam 1</button>
      </div>
      <label class="muted">Video file in data/videos
        <div class="row">
          <select id="vid" style="flex:1">
            {% for v in videos %}<option>{{ v }}</option>{% else %}<option value="">(no videos yet - upload one)</option>{% endfor %}
          </select>
          <button class="btn" onclick="vid.value && setSource(vid.value)">Play</button>
        </div>
      </label>
      <label class="muted">IP camera stream (RTSP / HTTP)
        <div class="row">
          <input id="rtsp" style="flex:1" placeholder="rtsp://user:pass@192.168.1.10:554/stream1">
          <button class="btn" onclick="rtsp.value && setSource(rtsp.value)">Connect</button>
        </div>
      </label>
      <label class="muted">Upload a video
        <div class="row">
          <input type="file" id="file" accept="video/*" style="flex:1">
          <button class="btn primary" onclick="upload()">Upload &amp; analyse</button>
        </div>
      </label>
      <div id="msg" class="muted"></div>
    </div>
  </div>
  <div class="panel">
    <h2>Active configuration <span class="pill">edit config.yaml and restart to change</span></h2>
    <textarea readonly class="config-view">{{ cfg_text }}</textarea>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const msg = document.getElementById("msg");
const current = document.getElementById("cur");

async function setSource(uri) {
  const res = await fetch("/api/source", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ uri }),
  });
  const data = await res.json();
  if (data.ok) {
    msg.textContent = `Switched to ${data.uri}. Open the Live monitor to watch it.`;
    current.textContent = data.uri;
  } else {
    msg.textContent = `Error: ${data.error}`;
  }
}

async function upload() {
  const input = document.getElementById("file");
  if (!input.files.length) return;
  const form = new FormData();
  form.append("video", input.files[0]);
  msg.textContent = "Uploading…";
  const data = await (await fetch("/api/upload", { method: "POST", body: form })).json();
  if (data.ok) {
    msg.textContent = `Uploaded. Now analysing ${data.uri}.`;
    current.textContent = data.uri;
  } else {
    msg.textContent = `Error: ${data.error}`;
  }
}
</script>
{% endblock %}
