{% extends "base.html" %}
{% block title %}Sources & settings{% endblock %}
{% block content %}
<div class="topbar"><div><h1>Sources &amp; settings</h1><div class="sub">Current source: <b id="cur">{{ current }}</b></div></div></div>
<div class="grid two">
  <div class="panel">
    <h2>Video source</h2>
    <div class="grid" style="gap:10px">
      <div><button class="btn" onclick="setSrc('simulated')">Synthetic test scene</button>
        <button class="btn" onclick="setSrc('0')">Webcam 0</button>
        <button class="btn" onclick="setSrc('1')">Webcam 1</button></div>
      <label class="muted">Video file in data/videos
        <div style="display:flex;gap:8px;margin-top:4px"><select id="vid" style="flex:1">
          {% for v in videos %}<option>{{ v }}</option>{% else %}<option value="">(no videos yet - upload one)</option>{% endfor %}
        </select><button class="btn" onclick="vid.value && setSrc(vid.value)">Play</button></div></label>
      <label class="muted">IP camera stream (RTSP / HTTP)
        <div style="display:flex;gap:8px;margin-top:4px"><input id="rtsp" style="flex:1" placeholder="rtsp://user:pass@192.168.1.10:554/stream1">
        <button class="btn" onclick="rtsp.value && setSrc(rtsp.value)">Connect</button></div></label>
      <label class="muted">Upload a video
        <div style="display:flex;gap:8px;margin-top:4px"><input type="file" id="file" accept="video/*" style="flex:1">
        <button class="btn primary" onclick="upload()">Upload &amp; analyse</button></div></label>
      <div id="msg" class="muted"></div>
    </div>
  </div>
  <div class="panel">
    <h2>Active configuration <span class="pill">edit config.yaml and restart to change</span></h2>
    <textarea readonly style="width:100%;height:420px;font-family:ui-monospace,monospace;font-size:12px">{{ cfg_text }}</textarea>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function setSrc(uri) {
  const r = await fetch("/api/source", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ uri }) });
  const j = await r.json();
  msg.textContent = j.ok ? `Switched to ${j.uri} - open the Live monitor.` : `Error: ${j.error}`;
  if (j.ok) cur.textContent = j.uri;
}
async function upload() {
  if (!file.files.length) return;
  const fd = new FormData(); fd.append("video", file.files[0]);
  msg.textContent = "Uploading…";
  const j = await (await fetch("/api/upload", { method: "POST", body: fd })).json();
  msg.textContent = j.ok ? `Uploaded and now analysing ${j.uri}.` : `Error: ${j.error}`;
  if (j.ok) cur.textContent = j.uri;
}
</script>
{% endblock %}
